---
# Example inventory file for production environment
# Customize this file for your infrastructure

all:
  children:
    webservers:
      hosts:
        web1.example.com:
          ansible_host: 192.168.1.10
          ansible_user: ansible
        web2.example.com:
          ansible_host: 192.168.1.11
          ansible_user: ansible
      vars:
        http_port: 80
        https_port: 443

    databases:
      hosts:
        db1.example.com:
          ansible_host: 192.168.1.20
          ansible_user: ansible
      vars:
        db_port: 5432

    loadbalancers:
      hosts:
        lb1.example.com:
          ansible_host: 192.168.1.5
          ansible_user: ansible
